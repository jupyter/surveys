# Build the MyST site and deploy to GitHub Pages
name: Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install MyST Markdown
        run: npm install -g mystmd
      - name: Link the surveys into the site
        run: python3 docs/build.py links
      - name: Build the site
        run: cd docs && myst build --html
        env:
          BASE_URL: /surveys
      - name: Write redirects for the URLs the site used to serve
        run: python3 docs/build.py redirects
        env:
          BASE_URL: /surveys
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/_build/html'
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
